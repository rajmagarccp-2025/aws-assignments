name: Terraform apply
description: Initialize the Terraform backend and apply a previously reviewed saved plan
inputs:
  root:
    description: Terraform configuration directory relative to the repository root
    required: true
  artifact-name:
    description: Name of the saved plan artifact
    required: true
  state-key:
    description: Unique S3 state key
    required: true
  use-backend:
    description: Whether to initialize the configured S3 backend
    required: true
  aws-region:
    description: AWS region
    required: true
  state-bucket:
    description: S3 state bucket
    required: true
  lock-table:
    description: DynamoDB lock table
    required: true
runs:
  using: composite
  steps:
    - name: Initialize Terraform
      shell: bash
      env:
        ROOT: ${{ inputs.root }}
        USE_BACKEND: ${{ inputs.use-backend }}
        AWS_REGION: ${{ inputs.aws-region }}
        STATE_BUCKET: ${{ inputs.state-bucket }}
        LOCK_TABLE: ${{ inputs.lock-table }}
        STATE_KEY: ${{ inputs.state-key }}
      working-directory: ${{ github.workspace }}/${{ inputs.root }}
      run: |
        set -euo pipefail
        if [[ "$USE_BACKEND" == "true" ]]; then
          umask 077
          cat > backend.hcl <<EOF
        bucket         = "$STATE_BUCKET"
        key            = "$STATE_KEY"
        region         = "$AWS_REGION"
        dynamodb_table = "$LOCK_TABLE"
        encrypt        = true
        use_lockfile   = true
        EOF
          terraform init -input=false -no-color -reconfigure -backend-config=backend.hcl
        else
          terraform init -input=false -no-color -backend=false
        fi

    - name: Apply saved plan
      shell: bash
      env:
        ROOT: ${{ inputs.root }}
      working-directory: ${{ github.workspace }}/${{ inputs.root }}
      run: terraform apply -input=false -no-color tfplan
